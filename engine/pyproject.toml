[project]
name = "openmob"
version = "0.1.0"
description = "OpenMob engine: control Android/iOS devices over HTTP, WebSocket, and MCP"
readme = "README.md"
authors = [
    { name = "Ritik Sharma", email = "pandatritik47@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "typer>=0.27.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
    "pymobiledevice3>=9.36.1",
    "httpx>=0.28.1",
]

[project.scripts]
openmob = "openmob.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
